[package]
name = "jianyi"
version = "0.1.0"
edition = "2021"
description = "A portable, deterministic, offline I Ching and tarot calculator."
license = "MIT OR Apache-2.0"
repository = "" # TODO(david): fill in the jianyi repo URL before publish
readme = "README.md"
keywords = ["iching", "i-ching", "tarot", "divination", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "jianyi"
path = "src/main.rs"

# Dev-only data generator, gated behind a feature so default builds and
# `cargo install` never compile it. Run: cargo run --bin gen-data --features gen-data
[[bin]]
name = "gen-data"
path = "src/bin/gen-data.rs"
required-features = ["gen-data"]

[features]
gen-data = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
