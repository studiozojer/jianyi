[package]
name = "jianyi"
version = "0.1.0"
edition = "2021"
description = "A portable, deterministic, offline I Ching and tarot calculator."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zojer-studio/jianyi"
readme = "README.md"
keywords = ["iching", "i-ching", "tarot", "divination", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "jianyi"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "jianyi"
path = "src/main.rs"
required-features = ["cli"]

# Dev-only data generator, gated behind a feature so default builds and
# `cargo install` never compile it. Run: cargo run --bin gen-data --features gen-data
[[bin]]
name = "gen-data"
path = "src/bin/gen-data.rs"
required-features = ["gen-data"]

[features]
default = ["cli"]
cli = ["dep:clap", "iching"]
iching = ["dep:sha2"]
# C ABI for host apps (zhouyi's Expo module on iOS/Android). JSON in/out,
# contract-identical to kairos-ffi's kairos_iching_* surface.
ffi = ["iching"]
gen-data = []
wasm = ["iching", "dep:wasm-bindgen"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
rand = "0.8"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
wasm-bindgen = { version = "0.2", optional = true }

# wasm32 needs getrandom's browser backend for rand, and chrono's wasm clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# wasm-pack's bundled wasm-opt (binaryen) predates the bulk-memory-ops that
# rustc now emits by default for wasm32-unknown-unknown, so it fails to
# validate the module. Skip the wasm-opt post-pass; the wasm-bindgen output
# is already reasonably sized without it, and zhouyi's bundler can re-optimize
# if needed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
