[package]
name = "jianyi"
version = "0.1.0"
edition = "2021"
description = "A portable, deterministic, offline I Ching and tarot calculator."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zojer-studio/jianyi"
readme = "README.md"
keywords = ["iching", "i-ching", "tarot", "divination", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "jianyi"
path = "src/lib.rs"

[[bin]]
name = "jianyi"
path = "src/main.rs"
required-features = ["cli"]

# Dev-only data generator, gated behind a feature so default builds and
# `cargo install` never compile it. Run: cargo run --bin gen-data --features gen-data
[[bin]]
name = "gen-data"
path = "src/bin/gen-data.rs"
required-features = ["gen-data"]

[features]
default = ["cli"]
cli = ["dep:clap", "iching"]
iching = ["dep:sha2"]
gen-data = []

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
